schema_version: "1.0"
project:
  id: buildmap
  name: BuildMap
  type: web-application
  repository_root: "."
  baseline_branch: main
inherits: [nextjs-supabase]
technology:
  languages: [typescript, sql]
  frameworks: [nextjs, supabase]
  database:
    engine: postgresql
scope:
  include:
    - "apps/web/**"
    - "supabase/**"
    - "scripts/**"
    - "docs/**"
    - ".review/**"
    - ".github/workflows/**"
  exclude:
    - "node_modules/**"
    - ".next/**"
    - "dist/**"
    - "coverage/**"
    - "apps/web/node_modules/**"
    - "apps/web/.next/**"
    - "apps/web/dist/**"
    - "apps/web/coverage/**"
    - ".pie/**"
protected_paths: []
commands:
  baseline: []
  integration: []
review:
  packs:
    - universal.test-completeness
    - application.authorization
    - data.rls
    - data.migration-safety
    - runtime.retries-idempotency
gate:
  block_on: [P0, P1]
  require:
    baseline_tests: false
    regression_tests: false
constraints:
  production_changes_allowed: false
  hosted_database_changes_allowed: false
  external_network_allowed: false
