name: EM-4A Criterion Provenance Contract
on:
  pull_request:
    paths:
      - "apps/web/app/projects/**/execution/**"
      - "apps/web/lib/execution/provenance-view.ts"
      - "apps/web/scripts/em4a-provenance-contract.mjs"
      - ".github/workflows/em4a-provenance-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  em4a-read-only:
    name: EM-4A provenance, lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install packages
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: EM-4A provenance contract
        working-directory: apps/web
        run: node --experimental-strip-types scripts/em4a-provenance-contract.mjs
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Build
        working-directory: apps/web
        run: npm run build
