name: EM-3B PR Verification Contract
on:
  pull_request:
    paths:
      - "apps/web/lib/execution/**"
      - "apps/web/scripts/em3b-authorized-pr-contract.mjs"
      - ".github/workflows/em3b-authorized-pr-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  em3b-preflight:
    name: EM-3B authorized PR recheck contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: node --experimental-strip-types apps/web/scripts/em3b-authorized-pr-contract.mjs
