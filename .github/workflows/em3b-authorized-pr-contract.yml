name: EM-3B PR Verification Contract
on:
  pull_request:
    paths:
      - "apps/web/lib/execution/**"
      - "apps/web/scripts/em3b-authorized-pr-contract.mjs"
      - "apps/web/scripts/em3b-server-authority-contract.mjs"
      - ".github/workflows/em3b-authorized-pr-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  em3b-preflight:
    name: EM-3B authorized PR recheck contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: node --experimental-strip-types apps/web/scripts/em3b-authorized-pr-contract.mjs

  web-validation:
    name: EM-3B web lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: EM-3B runtime authority and failure-path contract
        working-directory: apps/web
        run: node --experimental-strip-types scripts/em3b-server-authority-contract.mjs
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Production-equivalent build (preview only)
        working-directory: apps/web
        run: npm run build
