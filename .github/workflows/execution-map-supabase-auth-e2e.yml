name: Execution Map Supabase Auth E2E

on:
  pull_request:
    branches: [main, feat/execution-map-em2-github-evidence-preview, feat/execution-map-em2b-persistent-evidence, feat/execution-map-em3a-deterministic-evaluation-core, feat/execution-map-em3b-trusted-source-adapter]
    paths:
      - ".github/workflows/execution-map-supabase-auth-e2e.yml"
      - "supabase/migrations/**"
      - "apps/web/app/projects/**/execution/**"
      - "apps/web/scripts/em1-local-auth-e2e.mjs"
      - "apps/web/scripts/em2-local-auth-e2e.mjs"
      - "apps/web/components/execution/**"
      - "apps/web/lib/execution/**"
      - "apps/web/scripts/em2c-source-health-contract.mjs"
      - "apps/web/lib/execution/trusted-evaluation-server.ts"
      - "apps/web/app/api/projects/**/execution/verification-readiness/**"
      - "apps/web/scripts/em3b-trusted-server-adapter-contract.mjs"
      - "apps/web/scripts/em3c-manual-acceptance-contract.mjs"
      - "apps/web/components/execution/manual-acceptance-panel.tsx"
      - "apps/web/app/api/projects/**/execution/**"
      - "docs/execution-map/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/execution-map-supabase-auth-e2e.yml"
      - "supabase/migrations/**"
      - "apps/web/app/projects/**/execution/**"
      - "apps/web/scripts/em1-local-auth-e2e.mjs"

permissions:
  contents: read

jobs:
  auth-postgrest:
    name: EM-1 Local Supabase GoTrue + PostgREST
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Initialize disposable Supabase local config
        run: npx --yes supabase@2.120.0 init

      - name: Start local Supabase Auth, REST and DB services
        run: |
          npx --yes supabase@2.120.0 start -x studio,imgproxy,edge-runtime,vector,logflare,inbucket,realtime,storage-api

      - name: Exercise real GoTrue sessions and PostgREST row policies
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.120.0 status -o env > /tmp/em1-supabase-status.env
          set -a
          source /tmp/em1-supabase-status.env
          set +a
          test -n "$API_URL" && test -n "$ANON_KEY" && test -n "$SERVICE_ROLE_KEY"
          node apps/web/scripts/em1-local-auth-e2e.mjs
          node apps/web/scripts/em2-local-auth-e2e.mjs
          node apps/web/scripts/em3c-local-auth-e2e.mjs

      - name: Install isolated Playwright Chromium
        working-directory: apps/web
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Exercise real Builder UI, SSR session and owner-only routes
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.120.0 status -o env > /tmp/em1-supabase-status.env
          set -a
          source /tmp/em1-supabase-status.env
          set +a
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY"
          export NEXT_PUBLIC_SITE_URL="http://127.0.0.1:3000"
          export APP_URL="http://127.0.0.1:3000"
          (cd apps/web && npm run dev -- --hostname 127.0.0.1 --port 3000) > /tmp/em1-next.log 2>&1 &
          next_pid=$!
          trap 'kill "$next_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 120); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000/login; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            tail -120 /tmp/em1-next.log
            echo "Local Next.js app did not start" >&2
            exit 1
          fi
          if ! node apps/web/scripts/em1-local-browser-e2e.mjs; then
            tail -120 /tmp/em1-next.log
            exit 1
          fi

      - name: Shut down local Supabase
        if: always()
        run: npx --yes supabase@2.120.0 stop --no-backup || true

      - name: Scope assurance
        if: always()
        run: |
          echo "Local Supabase services in GitHub Actions only."
          echo "Hosted Supabase project not linked or modified."
          echo "Local browser + Auth E2E passed only if the required steps succeeded."
