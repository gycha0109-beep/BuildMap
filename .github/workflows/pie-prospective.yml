name: PIE Prospective Shadow

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - edited

permissions:
  contents: read
  pull-requests: read

jobs:
  pie:
    uses: gycha0109-beep/Project_Intelligence_Engine/.github/workflows/prospective-pr.yml@ace9202abc5387d0e7322a06a6d547bf25d66c2b
    with:
      repository: ${{ github.repository }}
      pull_request_number: ${{ github.event.pull_request.number }}
      event_head_sha: ${{ github.event.pull_request.head.sha }}
      pie_revision: ace9202abc5387d0e7322a06a6d547bf25d66c2b
      profile: .review/project.yml
      config: .review/intelligence/config.yml
