name: PIE Prospective Shadow

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - edited

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  pie:
    uses: gycha0109-beep/Project_Intelligence_Engine/.github/workflows/prospective-pr.yml@c5fde7a9e058b32462087a289f4515a365655c3b
    with:
      repository: ${{ github.repository }}
      pull_request_number: ${{ github.event.pull_request.number }}
      event_head_sha: ${{ github.event.pull_request.head.sha }}
      pie_revision: c5fde7a9e058b32462087a289f4515a365655c3b
      profile: .review/project.yml
      config: .review/intelligence/config.yml
      operational_policy: .review/operational/policy.yml

  historical-backfill-smoke:
    uses: gycha0109-beep/Project_Intelligence_Engine/.github/workflows/calibration-backfill.yml@ebe258e0c1ca262eebc85795f7d4d283d6f75b73
    with:
      repository: ${{ github.repository }}
      source_pie_revision: 96f9061d7538e92dbb8fdc8567147b3d6c01744e
      backfill_revision: ebe258e0c1ca262eebc85795f7d4d283d6f75b73
