name: Database Contract Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/database-contract.yml'
      - 'scripts/database-contract/**'
      - 'scripts/manual-controlled-staging-migration/phase31_controlled_staging_migration_manifest.json'
      - 'supabase/migrations/**'
      - 'supabase/migrations_draft/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/database-contract.yml'
      - 'scripts/database-contract/**'
      - 'scripts/manual-controlled-staging-migration/phase31_controlled_staging_migration_manifest.json'
      - 'supabase/migrations/**'
      - 'supabase/migrations_draft/**'

permissions:
  contents: read

jobs:
  repository-contract:
    name: Historical 00-10 integrity and additive migration contract
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact SHA
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -cne $env:EXPECTED_SHA) {
            throw "Exact-SHA checkout mismatch. expected=$env:EXPECTED_SHA actual=$actual"
          }

      - name: Run database contract gate
        shell: pwsh
        run: ./scripts/database-contract/check-post-phase31-migrations.ps1

      - name: Confirm safety boundary
        shell: pwsh
        run: |
          Write-Host 'RemoteDatabaseAccess: none'
          Write-Host 'RemoteMutationAttempted: false'
          Write-Host 'ProductionDeploymentDecision: OUT_OF_SCOPE'
