name: Web App CI

on:
  pull_request:
    branches: [main, feat/execution-map-em1-schema-foundation, feat/execution-map-em2-github-evidence-preview, feat/execution-map-em2b-persistent-evidence, feat/execution-map-em2c-permission-source-health, feat/execution-map-em3a-deterministic-evaluation-core]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Phase 52 Figma authority contract
        working-directory: apps/web
        run: npm run test:phase52

      - name: EM-1A execution schema static contract
        working-directory: apps/web
        run: npm run test:em1

      - name: EM-2A GitHub evidence source contract
        working-directory: apps/web
        run: npm run test:em2

      - name: EM-2B evidence persistence boundary contract
        working-directory: apps/web
        run: npm run test:em2b

      - name: EM-2C GitHub installation and source health contract
        working-directory: apps/web
        run: npm run test:em2c

      - name: EM-3A deterministic criterion and weighting policy
        working-directory: apps/web
        run: npm run test:em3a

      - name: EM-3B trusted server-only source correlation contract
        working-directory: apps/web
        run: npm run test:em3b

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Build
        working-directory: apps/web
        run: npm run build
